[project]
name = "churn-fastapi"
version = "0.1.0"
description = "FastAPI-сервис для предсказания оттока клиентов (churn prediction)"
readme = "README.md"
authors = [
    { name = "BadmaU", email = "u.badma@mail.ru" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "scikit-learn>=1.6.0",
    "pandas>=2.2.0",
    "joblib>=1.4.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
]

[project.scripts]
churn-fastapi = "churn_fastapi.main:run"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
